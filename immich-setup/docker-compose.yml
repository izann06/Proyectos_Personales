# =============================================================================
# 🖼️ IMMICH - Tu Google Photos privado, en tu propio ordenador
# =============================================================================
# Este archivo levanta 4 servicios que trabajan juntos:
#   1. El servidor de Immich (la app en sí)
#   2. Machine Learning (reconocimiento facial, búsqueda inteligente)
#   3. Redis / Valkey (una memoria rápida temporal que Immich necesita)
#   4. PostgreSQL (la base de datos donde se guarda todo)
#
# Para arrancarlo: docker compose up -d
# Para pararlo:    docker compose down
# Para ver logs:   docker compose logs -f
# =============================================================================

name: immich

services:

  # ---------------------------------------------------------------------------
  # 🖥️ SERVIDOR PRINCIPAL DE IMMICH
  # Es el cerebro de todo. Sirve la web, gestiona las fotos, habla con el móvil.
  # Puerto 2283 = entras en http://localhost:2283 desde tu navegador.
  # ---------------------------------------------------------------------------
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Aquí le decimos DÓNDE guardar las fotos en tu PC.
      # La variable UPLOAD_LOCATION está definida en el archivo .env
      - ${UPLOAD_LOCATION}:/data
      # Esto sincroniza la hora del contenedor con la de tu PC
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # Puerto para acceder desde el navegador: http://localhost:2283
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always

  # ---------------------------------------------------------------------------
  # 🧠 MACHINE LEARNING
  # Se encarga del reconocimiento facial y de la búsqueda inteligente de fotos.
  # Funciona en segundo plano, no necesitas tocarlo.
  # ---------------------------------------------------------------------------
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      # Caché para los modelos de IA (se descargan una vez y se reutilizan)
      - model-cache:/cache
    env_file:
      - .env
    restart: always

  # ---------------------------------------------------------------------------
  # ⚡ VALKEY (REDIS)
  # Una base de datos ultra-rápida que Immich usa como memoria temporal.
  # ---------------------------------------------------------------------------
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  # ---------------------------------------------------------------------------
  # 🗄️ BASE DE DATOS (PostgreSQL)
  # Aquí se guarda toda la información: usuarios, álbumes, metadatos de fotos.
  # Las fotos en sí se guardan en la carpeta UPLOAD_LOCATION, no aquí.
  # ---------------------------------------------------------------------------
  database:
    container_name: immich_postgres
    # Nueva imagen de base de datos oficial para Immich v1.115+
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}       # Contraseña (definida en .env)
      POSTGRES_USER: ${DB_USERNAME}           # Usuario (definido en .env)
      POSTGRES_DB: ${DB_DATABASE_NAME}        # Nombre de la base de datos
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Dónde se guardan los datos internos de la base de datos
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

# =============================================================================
# 💾 VOLÚMENES
# Son "discos virtuales" que Docker crea para guardar datos de forma persistente.
# Aunque borres los contenedores, estos datos se mantienen.
# =============================================================================
volumes:
  model-cache:    # Modelos de IA descargados para reconocimiento facial